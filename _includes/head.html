<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="Jekyll">
    <link rel="license" href="LICENSE">

    <meta name="application-name" content="{{ site.title }}">
    <meta name="theme-color" content="{{ site.theme_color }}">
    <link rel="archives" href="{{site.url}}/archives/">

    <meta name="robots" content="index,follow"> <!-- All Search Engines -->
    <meta name="googlebot" content="index,follow"><!-- Google Specific    -->

    <!-- PWA and Performance optimizations -->
    <meta http-equiv="Accept-CH" content="DPR, Viewport-Width, Width">
    <meta http-equiv="Accept-CH-Lifetime" content="86400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="{{ site.title }}">
    <meta name="msapplication-TileColor" content="{{ site.theme_color }}">
    <meta name="msapplication-config" content="/browserconfig.xml">
    
    <!-- Performance hints -->
    <meta http-equiv="Accept-Encoding" content="gzip, deflate, br">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/assets/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/assets/fonts/trade_gothic_lt-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/main.css" as="style">
    <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    
    <!-- Critical CSS inline for above-the-fold content - MINIMAL VERSION -->
    <style>
      /* Critical CSS - Only essential layout and typography */
      @font-face {
        font-family: 'tradegothic_ltregular';
        src: url('/assets/fonts/trade_gothic_lt-webfont.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      
      /* Essential box model */
      * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }
      
      /* Basic body setup */
      body {
        font-family: 'tradegothic_ltregular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
      }
      
      /* Essential images */
      img {
        max-width: 100%;
        height: auto;
      }
      
      /* Skip link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 6px;
        background: #000;
        color: white;
        padding: 8px;
        text-decoration: none;
        z-index: 100;
      }
      
      .skip-link:focus {
        top: 6px;
      }
      
      /* Desktop-specific optimizations */
      @media (min-width: 1024px) {
        /* Optimize for larger screens */
        body { font-size: 16px; }
        img { max-width: 100%; height: auto; }
        
        /* Smooth scrolling for desktop */
        html { scroll-behavior: smooth; }
        
        /* Optimize hover effects */
        a:hover { transition: color 0.2s ease; }
        button:hover { transition: all 0.2s ease; }
      }
    </style>
    
    <!-- Optimized font loading -->
    <link rel="stylesheet" href="/assets/fonts/stylesheet.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/assets/fonts/stylesheet.css"></noscript>
    
    <!-- Non-critical CSS -->
    <link rel="stylesheet" href="/assets/main.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/assets/main.css"></noscript>
    <link rel="stylesheet" href="/assets/code.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/assets/code.css"></noscript>
    <link rel="stylesheet" href="/assets/desktop-optimized.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/assets/desktop-optimized.css"></noscript>
    <link rel="stylesheet" href="/assets/mobile-optimized.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/assets/mobile-optimized.css"></noscript>
    
    <!-- Defer non-critical CSS -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    
    <!-- Defer Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js" crossorigin="anonymous" defer></script>
    
    <!-- Local scripts -->
    <script src="/assets/simple-jekyll-search.js" defer></script>
    
    <!-- Performance monitoring -->
    <script src="/assets/performance-monitor.js" defer></script>
    
    <!-- Image optimization for desktop -->
    <script src="/assets/image-optimizer.js" defer></script>
    
    <!-- Mobile performance optimization -->
    <script src="/assets/mobile-performance.js" defer></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/assets/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    {%- seo -%}
    {%- feed_meta -%}
    <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml">
    {% if site.google_analytics and jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}
</head>
